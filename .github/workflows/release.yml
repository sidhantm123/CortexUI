# Builds CortexUI for Windows, Apple Silicon and Intel Macs, and smoke-tests each build.
# A pushed tag vX.Y.Z (matching version.py) also makes a draft GitHub release with the three files.
name: Build

on:
  push:
    branches: ['release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            artifact: macos-apple-silicon
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-intel
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover tests

      - name: Build the app
        run: pyinstaller --clean --noconfirm cortexui.spec

      - name: Smoke test the built app
        timeout-minutes: 5
        run: |
          python -c "from tests.test_smoke import write_recording; write_recording('smoke-data/rec')"
          if [ "$RUNNER_OS" = Windows ]; then
            app=dist/CortexUI/CortexUI.exe
            log="$APPDATA/CortexUI/error.log"
          else
            app=dist/CortexUI.app/Contents/MacOS/CortexUI
            log="$HOME/Library/Application Support/CortexUI/error.log"
          fi
          if "$app" --smoke-test smoke-data/rec; then
            echo "smoke test passed"
          else
            echo "::error::The built app failed its smoke test"
            cat "$log" 2>/dev/null || true
            exit 1
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/make_dmg.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          Compress-Archive -Path dist/CortexUI -DestinationPath "dist/CortexUI-$version-Windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/CortexUI-*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches version.py
        run: |
          version=$(python3 -c "from version import APP_VERSION; print(APP_VERSION)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($version)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/CortexUI-* --draft \
            --title "CortexUI ${GITHUB_REF_NAME#v}" --notes-file packaging/release_notes.md
